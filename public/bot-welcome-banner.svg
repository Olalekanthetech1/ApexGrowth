<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0b1220" />
      <stop offset="80%" stop-color="#0d172e" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="url(#bg)" />

  <!-- Ambient background glow aura -->
  <circle cx="480" cy="240" r="340" fill="url(#coreGlow)" />

  <!-- Subtle Perspective Grid Lines for Tech Dimension -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="460" x2="960" y2="460" />
    <line x1="0" y1="490" x2="960" y2="490" />
    <line x1="0" y1="515" x2="960" y2="515" />
    <!-- Radiating perspective lines -->
    <line x1="480" y1="300" x2="80" y2="540" />
    <line x1="480" y1="300" x2="240" y2="540" />
    <line x1="480" y1="300" x2="400" y2="540" />
    <line x1="480" y1="300" x2="560" y2="540" />
    <line x1="480" y1="300" x2="720" y2="540" />
    <line x1="480" y1="300" x2="880" y2="540" />
  </g>

  <!-- Outer Scout Radar Ring Background -->
  <circle cx="480" cy="220" r="180" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5" />
  <circle cx="480" cy="220" r="130" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" />
  <circle cx="480" cy="220" r="80" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Radar targeting markers -->
  <line x1="480" y1="30" x2="480" y2="60" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="480" y1="380" x2="480" y2="410" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="290" y1="220" x2="320" y2="220" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="640" y1="220" x2="670" y2="220" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Sweeping Radar Line with Signal Blip -->
  <line x1="480" y1="220" x2="610" y2="120" stroke="url(#cyanBeam)" stroke-width="2.5" opacity="0.8" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="610" cy="120" r="6" fill="#38bdf8" filter="url(#heavyGlow)" />
  <circle cx="610" cy="120" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- Center Floating Emblem -->
  <!-- Backing Shadow Chevron -->
  <path d="M480 110 L560 210 L530 210 L480 148 L430 210 L400 210 Z" fill="#1e1b4b" opacity="0.7" />

  <!-- Upper Apex Chevron (Indigo -> Cyan Gradient) -->
  <path d="M480 125 L554 216 L526 216 L480 160 L434 216 L406 216 Z" fill="url(#indigoGlow)" filter="url(#glow)" />

  <!-- Secondary Dynamic Mid Chevron -->
  <path d="M480 180 L538 252 L514 252 L480 210 L446 252 L422 252 Z" fill="url(#cyanBeam)" opacity="0.9" />

  <!-- Core Base Diamond -->
  <polygon points="480,230 502,256 480,282 458,256" fill="url(#indigoGlow)" />
  <circle cx="480" cy="256" r="5" fill="#ffffff" filter="url(#glow)" />

  <!-- Left Intelligence Badge Card -->
  <g transform="translate(100, 150)">
    <rect width="190" height="80" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="#4f46e5" fill-opacity="0.2" />
    <path d="M26 32 L30 36 L38 26" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">24/7 Pipeline</text>
    <text x="54" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Automated Lead Scout</text>
    <rect x="18" y="58" width="80" height="12" rx="6" fill="#10b981" fill-opacity="0.15" />
    <circle cx="24" cy="64" r="3" fill="#10b981" />
    <text x="32" y="67" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold">SYSTEM LIVE</text>
  </g>

  <!-- Right Evidence Badge Card -->
  <g transform="translate(670, 150)">
    <rect width="190" height="80" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="#06b6d4" fill-opacity="0.2" />
    <path d="M26 28 L38 28 M26 32 L35 32 M26 36 L32 36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="54" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Live HTTP Audits</text>
    <text x="54" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Objective Provenance</text>
    <rect x="18" y="58" width="92" height="12" rx="6" fill="#38bdf8" fill-opacity="0.15" />
    <text x="24" y="67" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold">VERIFIED SIGNALS</text>
  </g>

  <!-- Typography Block -->
  <!-- Top Tagline -->
  <text x="480" y="330" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4">
    AUTONOMOUS CONVERSION INTELLIGENCE
  </text>

  <!-- Main Headline Title -->
  <text x="480" y="375" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="0.5">
    ApexGrowth Intelligence
  </text>

  <!-- Subtitle Paragraph -->
  <text x="480" y="412" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="0.2">
    24/7 Opportunity Scout • Live Evidence Audits • Telegram Command Center
  </text>

  <!-- Interactive Control Pill at Bottom -->
  <g transform="translate(390, 436)">
    <rect width="180" height="34" rx="17" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="24" cy="17" r="4" fill="#10b981" />
    <text x="38" y="22" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      HUMAN-IN-THE-LOOP
    </text>
  </g>

  <!-- Subtle Border Framing -->
  <rect x="1" y="1" width="958" height="538" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>