<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border ring -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.6" />
  <circle cx="256" cy="256" r="200" fill="url(#centerGlow)" />

  <!-- Outer Radar concentric rings for intelligence/scout motif -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.3" />
  <circle cx="256" cy="256" r="92" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Radar sweep line -->
  <line x1="256" y1="256" x2="390" y2="160" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.5" stroke-linecap="round" />
  <circle cx="390" cy="160" r="5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Central Apex chevron / growth arrows -->
  <!-- Layer 1: Base Shadow chevron -->
  <path d="M256 122 L372 258 L330 258 L256 172 L182 258 L140 258 Z" fill="#1e1b4b" opacity="0.6" />

  <!-- Layer 2: Main Upper Chevron (Growth Crest) -->
  <path d="M256 142 L362 266 L324 266 L256 186 L188 266 L150 266 Z" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Layer 3: Secondary Mid Chevron (Momentum/Speed) -->
  <path d="M256 220 L336 312 L304 312 L256 256 L208 312 L176 312 Z" fill="url(#cyanGlow)" opacity="0.9" />

  <!-- Layer 4: Foundation Core Diamond Point -->
  <polygon points="256,290 286,326 256,362 226,326" fill="url(#accentGrad)" />

  <!-- Core Pulse Center Orb -->
  <circle cx="256" cy="326" r="6" fill="#ffffff" filter="url(#glow)" />

  <!-- Subtle Corner Scout Target Crosshairs -->
  <path d="M256 46 L256 70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M256 442 L256 466" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M46 256 L70 256" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M442 256 L466 256" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

</svg>